[project]
name = "stroke-medical-rag"
version = "0.1.0"
description = "Stroke-focused retrieval-augmented generation system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pymupdf>=1.23.0",
  "pydantic>=2.5.0",
]

[project.scripts]
stroke-rag = "medical_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
  "eval: live-server evaluation tests (require running server + ingested index)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
