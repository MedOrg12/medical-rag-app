limit_req_zone $binary_remote_addr zone=medical_rag_deploy:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=medical_rag_deploy_status:10m rate=30r/m;

server {
    listen 443 ssl;

    # This hostname and these certificate paths are temporary deployment values.
    ssl_certificate /etc/nginx/ssl/web1-rag_efeyzee_dev.cert.pem;
    ssl_certificate_key /etc/nginx/ssl/web1-rag_efeyzee_dev.key.pem;

    server_name web1-rag.efeyzee.dev;

    location = /internal/deploy {
        limit_except POST { deny all; }
        limit_req zone=medical_rag_deploy burst=2 nodelay;

        client_max_body_size 4k;
        client_body_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        proxy_pass http://127.0.0.1:9100/deploy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/internal/deploy/([0-9a-f]{32})$ {
        limit_except GET { deny all; }
        limit_req zone=medical_rag_deploy_status burst=10 nodelay;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://127.0.0.1:9100/deploy/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Corpus ingestion is an administrative operation and is disabled publicly.
    location = /ingest {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
