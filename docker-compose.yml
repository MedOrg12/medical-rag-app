services:
  medical-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stroke-medical-rag
    ports:
      - "8000:8000"
    volumes:
      - ./pdfs:/app/pdfs:cached
      - rag_index:/app/.rag
    environment:
      RAG_CORPUS_DIR: /app/pdfs
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-json}
      RAG_INDEX_PATH: /app/.rag/index.json
      RAG_MANIFEST_PATH: /app/.rag/manifest.sqlite
      RAG_EXTRACTION_CACHE_DIR: /app/.rag/extracted
      RAG_EMBEDDING_CACHE_PATH: /app/.rag/embedding_cache.json
      RAG_QDRANT_URL: ${RAG_QDRANT_URL:-http://qdrant:6333}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-stroke_chunks}
      RAG_QDRANT_BATCH_SIZE: ${RAG_QDRANT_BATCH_SIZE:-128}
      RAG_QDRANT_RECREATE_COLLECTION: ${RAG_QDRANT_RECREATE_COLLECTION:-true}
      RAG_AUTO_INGEST_ON_STARTUP: "true"
      RAG_PDF_WORKERS: ${RAG_PDF_WORKERS:-1}
      RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-64}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-auto}
      RAG_GENERATION_BACKEND: ${RAG_GENERATION_BACKEND:-extractive}
      RAG_ANSWER_MODE: ${RAG_ANSWER_MODE:-patient}
      RAG_OLLAMA_BASE_URL: ${RAG_OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_OLLAMA_EMBEDDING_MODEL: ${RAG_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_OLLAMA_GENERATION_MODEL: ${RAG_OLLAMA_GENERATION_MODEL:-llama3.1}
      RAG_API_BASE_URL: ${RAG_API_BASE_URL:-https://api.openai.com/v1}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_API_GENERATION_MODEL: ${RAG_API_GENERATION_MODEL:-gpt-4o-mini}
      RAG_API_EMBEDDING_MODEL: ${RAG_API_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_REQUEST_TIMEOUT_SECONDS: ${RAG_REQUEST_TIMEOUT_SECONDS:-120}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: stroke-medical-rag-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: stroke-medical-rag-qdrant
    profiles:
      - qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  rag_index:
  ollama_data:
  qdrant_data:
